# @package _global_

defaults:
  - override /hydra/sweeper/sampler: random 
  - override /hydra/sweeper: optuna 
  
optimized_metric: mean_cross_entropy

hydra:

  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper

    direction: minimize

    n_jobs: 10
    
    n_trials: 10

    sampler: 
      _target_: optuna.samplers.RandomSampler

    # define hyperparameter search space
    params:

      vf.state_encoder_mlp_kwargs.hidden_dims: choice("256-256", "512-512")

      vf.state_encoder_output_dim: choice(128, 256, 512, 1024)

      vf.time_features_num_freqs: choice(128, 256, 512)

      vf.time_features_max_periods: choice(1000, 10000)

      vf.time_encoder_output_dim: choice(128, 256, 512, 1024)

      vf.time_encoder_mlp_kwargs.hidden_dims: choice("256-256", "512-512")

      vf.perturbation_encoder_output_dim: choice(128, 256, 512, 1024)

      vf.decoder_mlp_kwargs.hidden_dims: choice("128-128-128", "256-256-256", "512-512-512")
      
      vf.resnet_normalization: choice("batch", "none")

      vf.conditioning_type: choice("concatenation", "resnet", "film")

      training.train_batch_size: choice(512, 1024, 2048, 4096, 8192)

      training.num_grad_accumulation_steps: choice(100, 500, 1000)
