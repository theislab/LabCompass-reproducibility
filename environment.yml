# Environment used for the results in the paper.
#
#   conda env create -f environment.yml
#   conda activate labcompass
#
# Two further packages are installed from source afterwards, because they are
# developed alongside this repository and are not on PyPI:
#
#   git clone https://github.com/theislab/LabCompass.git && pip install -e LabCompass
#   git clone https://github.com/theislab/scOpt.git      && pip install -e scOpt
#
# NOTE ON TORCH: the pin below is the CUDA 12.8 build that was used on the
# cluster. On a machine with a different CUDA version, or none at all, install
# torch first following https://pytorch.org/get-started/locally/ and then remove
# the torch line here, otherwise the solve will fail or give you a build that
# cannot see your GPU.
#
# `environment.lock.txt` alongside this file is a full freeze of all 250
# packages in the environment that produced the paper's results. It is exact but
# platform-specific; use it to audit versions rather than to install.

name: labcompass

channels:
  - conda-forge

dependencies:
  - python=3.12.9
  - pip
  - pip:
      # core modelling stack
      - torch==2.10.0
      - numpy==2.3.5
      - scipy==1.16.3
      - pandas==2.3.3
      - scikit-learn==1.8.0
      - numba==0.63.1
      - statsmodels==0.14.6

      # single-cell data handling
      - anndata==0.12.10
      - scanpy==1.12
      - h5py==3.15.1
      - leidenalg==0.12.0
      - igraph==1.0.0
      - fpsample==1.0.2

      # configuration and experiment orchestration
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - hydra-optuna-sweeper==1.2.0
      - hydra-submitit-launcher==1.2.0
      - optuna==2.10.1
      - pyyaml==6.0.3

      # checkpoint serialisation and data access
      - cloudpickle==3.1.2
      - huggingface-hub==1.31.0

      # plotting, tracking, io
      - matplotlib==3.10.8
      - seaborn==0.13.2
      - wandb==0.25.0
      - tqdm==4.67.3
      - openpyxl==3.1.5
